name: densenet-hawq-bc-76-12
desc: HAWQ analysis for DenseNet-BC (L=76, k=12) on CIFAR-10

cmd: >
  python3 hawq_analysis.py \
    --model densenet_bc_76_12 \
    --checkpoint models/cifar10_densenet_bc_76_12.pt \
    --device cuda \
    --name densenet_bc_100_12_hawq

inputs:
  - hawq_analysis.py
  - experiment_dq.py
  - densenet_quant.py
  - dq_quantizer.py
  - data_utils.py
  - models/cifar10_densenet_bc_76_12.pt

outputs:
  - models/
  - results/

env:
  python:
    type: manual
    version: 3.12.2
    pip:
      index-url: https://download.pytorch.org/whl/cu118
      extra-index-urls:
        - https://pypi.org/simple
      trusted-hosts:
        - pytorch.org
        - pypi.org

    requirements-file: infra/requirements.txt
    root-path:
      - hawq_analysis.py
    local-paths:
      - experiment_dq.py
      - densenet_quant.py
      - dq_quantizer.py
      - data_utils.py

flags:
  - attach-project-disk

cloud-instance-types:
  - g2.1 # A100

graceful-shutdown:
  signal: SIGTERM
  timeout: 15s
